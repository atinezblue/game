<head>

<title>Bottle Flip: World Tour</title>
<style>
  :root { --bg: #f6f9fb; --card: #fff; --ink: #16232e; --muted: #5b6b78; --line: #d9e3ea; --accent: #2f7fc4; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #10171d; --card: #17212a; --ink: #e6edf3; --muted: #93a4b1; --line: #263442; --accent: #6fb3e8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 64px 16px;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; text-align: center; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  .links a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; text-decoration: none; color: var(--accent); font-weight: 600; }
</style>
</head>
